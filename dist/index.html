:root{
  --forest:#254638; --forest-2:#1C372C; --forest-3:#21402F; --leaf:#718665; --leaf-ink:#4D6346; --leaf-tint:#E4EADC;
  --ivory:#F7F4EC; --sand:#EFE8D8; --field:#ECEEE1; --white:#FFFFFF;
  --clay:#BC8B61; --clay-ink:#7A4B26; --clay-light:#E3C4A2; --gold-soft:#F3DDC3;
  --ink:#252B27; --muted:#535B55; --line:#DED6C4; --line-dark:rgba(247,244,236,.18);
  --on-dark:#ECE6D6; --on-dark-muted:#D3CFBF;
  --serif:"Newsreader", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --sans:"DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --deva:"Noto Serif Devanagari", "Noto Sans Devanagari", "Mangal", serif;
  --radius:22px; --gutter:clamp(18px, 4.5vw, 44px); --max:1200px; --head:68px;
  --ease-out:cubic-bezier(.2,.7,.2,1);
  --stage-h:min(58svh, 520px);
  --step-h:72svh;
  color-scheme: light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:calc(var(--head) + 8px)}
body{margin:0;background:var(--ivory);color:var(--ink);font:400 1.0625rem/1.65 var(--sans);overflow-x:clip}
img,svg{display:block;max-width:100%}
a{color:var(--forest);text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:3px solid var(--clay);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:-.012em;line-height:1.06;margin:0}
h2{font-size:clamp(2.25rem,5.4vw,3.7rem);text-wrap:balance}
h3{font-size:1.5rem;line-height:1.18}
p{margin:0 0 1em;text-wrap:pretty}
em{font-style:italic}
.wrap{position:relative;z-index:2;max-width:var(--max);margin:0 auto;padding:0 var(--gutter)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:-999px;top:8px;background:var(--forest);color:var(--ivory);padding:10px 14px;border-radius:8px;z-index:100}
.skip:focus{left:8px}
.eyebrow{font:600 .78rem/1.2 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--clay-ink);margin:0 0 16px;display:flex;gap:10px;align-items:center}
.eyebrow .num{font:italic 400 1.05rem/1 var(--serif);letter-spacing:0;text-transform:none}
.eyebrow::after{content:"";flex:0 0 48px;height:1px;background:currentColor;opacity:.5}
.lead{font-size:clamp(1.08rem,2.1vw,1.24rem);color:var(--muted);max-width:38em}

/* ---------- The 3D canvas ---------- */
.grain-canvas{position:fixed;inset:0 0 auto 0;width:100%;height:100lvh;z-index:1;pointer-events:none;opacity:0;transition:opacity .9s ease}
.has-3d .grain-canvas{opacity:1}
html:not(.can-3d) .grain-canvas{display:none}

/* ---------- Header ---------- */
.site-header{position:fixed;inset:0 0 auto 0;z-index:50;color:var(--forest);transition:background-color .3s,box-shadow .3s}
.site-header .bar{display:flex;align-items:center;justify-content:space-between;height:var(--head)}
.site-header.solid,.site-header.open{background:rgba(247,244,236,.94);box-shadow:0 1px 0 var(--line);-webkit-backdrop-filter:saturate(1.2) blur(12px);backdrop-filter:saturate(1.2) blur(12px)}

.mainnav ul{list-style:none;margin:0;padding:0;display:flex;gap:30px}

.mainnav a::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:2px;background:var(--clay);transform:scaleX(0);transform-origin:left;transition:transform .25s var(--ease-out)}
.mainnav a:hover::after,.mainnav a[aria-current="true"]::after{transform:scaleX(1)}
.menu-btn{display:none;appearance:none;border:1px solid currentColor;background:transparent;color:inherit;border-radius:999px;
  font:600 .88rem/1 var(--sans);padding:0 16px;height:44px;align-items:center;gap:8px;cursor:pointer}
.menu-btn svg{width:18px;height:18px}
.menu-btn .i-close,.site-header.open .menu-btn .i-open{display:none}
.site-header.open .menu-btn .i-close{display:inline}
.progress{position:absolute;left:0;right:0;bottom:-2px;height:2px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--clay);transform-origin:left;transform:scaleX(0)}
@media (max-width:879px){
  .menu-btn{display:inline-flex}
  .mainnav{position:absolute;top:var(--head);left:0;right:0;background:var(--ivory);border-bottom:1px solid var(--line);
    box-shadow:0 16px 30px rgba(37,43,39,.12);display:none}
  .site-header.open .mainnav{display:block}
  .mainnav ul{flex-direction:column;gap:0;padding:6px var(--gutter) 14px}
  .mainnav li{border-top:1px solid var(--line)}
  .mainnav li:first-child{border-top:0}
  .mainnav a{padding:16px 0;font-size:1.05rem;color:var(--forest)}
  .mainnav a::after{display:none}
  .mainnav a[aria-current="true"]{color:var(--clay-ink)}
}

/* ---------- Buttons ---------- */
.cta-row{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--forest);color:var(--ivory);text-decoration:none;
  font:600 1rem/1 var(--sans);padding:0 26px;border-radius:999px;min-height:54px;border:0;cursor:pointer;
  transition:background-color .2s,transform .2s var(--ease-out),box-shadow .2s}
.btn:hover{background:var(--forest-2);text-decoration:none;box-shadow:0 10px 24px rgba(28,55,44,.22)}
.btn:active{transform:translateY(1px)}
.btn svg{width:18px;height:18px}
.btn.light{background:var(--ivory);color:var(--forest)}
.btn.light:hover{background:var(--white)}
.btn.ghost{background:transparent;color:var(--forest);box-shadow:inset 0 0 0 1.5px var(--forest)}
.btn.ghost:hover{background:rgba(255,255,255,.6)}
.textlink{color:var(--forest);font:500 1rem/1.3 var(--sans);min-height:44px;display:inline-flex;align-items:center}

/* ---------- Hero ---------- */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;
  background:
    radial-gradient(60% 55% at 72% 46%, #FFF8EA 0%, rgba(255,248,234,0) 70%),
    linear-gradient(180deg, #F4EEE1 0%, var(--ivory) 70%)}
.hero .hero-stage{position:absolute;z-index:2;right:0;top:var(--head);bottom:0;width:52%;pointer-events:none}
.grain-fallback{position:absolute;left:50%;top:50%;height:74%;width:auto;transform:translate(-50%,-50%);transition:opacity .9s ease;
  filter:drop-shadow(0 30px 40px rgba(122,75,38,.18))}
.has-3d .grain-fallback{opacity:0}
.hero-copy{padding-top:120px;padding-bottom:clamp(96px,14vh,150px);width:100%}
.hero-copy > *{max-width:36rem}
.hero .deva{font:500 1.05rem/1.5 var(--deva);color:var(--clay-ink);margin:0 0 14px}
.hero h1{font-size:clamp(3.3rem,8.4vw,7.2rem);font-weight:500;line-height:.94;margin:0 0 26px;letter-spacing:-.025em;color:var(--forest)}
.hero h1 em{display:block;font-weight:400;color:var(--clay-ink)}
.hero .lead{margin-bottom:34px;color:var(--muted)}
@media (max-width:899px){
  .hero{background:
    radial-gradient(80% 40% at 50% 26%, #FFF8EA 0%, rgba(255,248,234,0) 72%),
    linear-gradient(180deg, #F4EEE1 0%, var(--ivory) 70%)}
  .hero .hero-stage{left:0;right:0;width:auto;bottom:auto;height:44svh}
  .hero-copy{padding-top:calc(var(--head) + 44svh);padding-bottom:84px}
  .hero h1{font-size:clamp(3rem,13vw,4.4rem)}
  .hero .lead{margin-bottom:26px}
}
@media (max-width:899px) and (max-height:700px){
  .hero .hero-stage{height:36svh}
  .hero-copy{padding-top:calc(var(--head) + 36svh)}
}
html:not(.can-3d) .hero-stage{opacity:1}


/* ---------- Chapters: a stage column for the grain + a copy column ---------- */
.chapter{position:relative;padding:clamp(80px,11vw,140px) 0}
.chapter-head{margin-bottom:clamp(30px,5vw,48px)}
.chapter-head h2{margin-bottom:18px}
.stage{position:relative;pointer-events:none}
.stage > *{pointer-events:auto}
.chapter-grid{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "stage" "body"}
.chapter-head{grid-area:head}
.stage-col{grid-area:stage;position:relative}
.chapter-body{grid-area:body;min-width:0}
.can-3d .chapter-grid .stage{height:var(--stage-h)}
@media (min-width:900px){
  .chapter-grid{column-gap:clamp(32px,5vw,80px);grid-template-rows:auto 1fr}
  .chapter--stage-left .chapter-grid{grid-template-columns:minmax(0,5fr) minmax(0,6fr);grid-template-areas:"stage head" "stage body"}
  .chapter--stage-right .chapter-grid{grid-template-columns:minmax(0,6fr) minmax(0,5fr);grid-template-areas:"head stage" "body stage"}
  .can-3d .chapter-grid .stage{position:sticky;top:var(--head);height:calc(100svh - var(--head))}
  html:not(.can-3d) .chapter-grid{grid-template-columns:minmax(0,46rem);grid-template-areas:"head" "body"}
  html:not(.can-3d) .stage-col{display:none}
}

/* ---------- 01 Farmers ---------- */
#farmers{background:linear-gradient(180deg,var(--ivory) 0%, #F6F2E8 100%)}
.farmer{background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 30px 60px -40px rgba(37,43,39,.35)}
.farmer + .farmer{margin-top:24px}
.farmer .photo{position:relative;aspect-ratio:4/3;background:var(--sand)}
.farmer .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.farmer-body{padding:clamp(26px,4vw,48px)}
.farmer-body .kicker{font:600 .74rem/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--leaf-ink);margin:0 0 14px}
.farmer-body h3{font-size:clamp(1.9rem,3.4vw,2.6rem);margin-bottom:12px;color:var(--forest)}
.farmer-body .place{color:var(--muted);margin:0 0 18px}
.farmer-body .story{font:400 clamp(1.12rem,1.8vw,1.28rem)/1.55 var(--serif);color:var(--ink);margin:0 0 26px}
.facts{list-style:none;padding:0;margin:0;display:grid}
.facts li{display:grid;grid-template-columns:minmax(7.5rem,10rem) 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--line);font-size:.97rem}
.facts li span:first-child{color:var(--muted);font-size:.86rem;padding-top:2px}
blockquote.quote{margin:26px 0 0;padding:0 0 0 18px;border-left:2px solid var(--clay);font:italic 400 1.35rem/1.45 var(--serif);color:var(--forest)}
blockquote.quote cite{display:block;font:500 .85rem/1.4 var(--sans);font-style:normal;color:var(--muted);margin-top:8px}

.mvs{margin-top:clamp(22px,3vw,32px);background:var(--forest);color:var(--ivory);border-radius:var(--radius);padding:clamp(28px,4vw,48px)}
.mvs h3{font-size:clamp(1.8rem,3.2vw,2.3rem);margin-bottom:12px}
.mvs-intro{color:var(--on-dark-muted);margin:0 0 28px}
.mvs ul{list-style:none;margin:0;padding:0;display:grid;gap:0}
.mvs li{display:grid;grid-template-columns:44px 1fr;gap:4px 18px;padding:20px 0;border-top:1px solid var(--line-dark)}
.mvs li svg{grid-row:span 2;width:30px;height:30px;color:var(--clay-light);margin-top:2px}
.mvs li b{font:500 1.25rem/1.25 var(--serif)}
.mvs li p{color:var(--on-dark-muted);font-size:.96rem;margin:0}

/* ---------- 02 Practices ---------- */
.practices{background:linear-gradient(180deg,#F6F2E8 0%, var(--field) 22vh, var(--field) calc(100% - 36vh), var(--forest-3) 100%);padding-bottom:calc(36vh + 20px)}
.p-intro{border-left:2px solid var(--clay);padding:4px 0 4px 22px;margin-bottom:clamp(28px,4vw,40px)}
.p-intro h3{font-size:clamp(1.6rem,2.8vw,2.1rem);margin-bottom:10px;color:var(--forest)}
.p-intro p{color:var(--muted);margin:0;max-width:34em}
.p-list{display:grid;gap:18px}
.p-card{position:relative;background:rgba(255,255,255,.92);border:1px solid #DCDDCB;border-radius:var(--radius);padding:clamp(24px,3vw,34px);
  display:grid;gap:18px;box-shadow:0 26px 50px -38px rgba(37,43,39,.4);scroll-margin-top:calc(var(--head) + 24px)}
.p-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.p-theme{display:flex;align-items:center;gap:10px;font:600 .74rem/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--leaf-ink)}
.p-theme svg{width:28px;height:28px;color:var(--forest)}
.p-num{font:italic 400 1.15rem/1 var(--serif);color:var(--clay-ink)}
.p-card h3{font-size:clamp(1.5rem,2.4vw,1.8rem);color:var(--forest)}
.p-label{font:700 .7rem/1.35 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--clay-ink);margin:0 0 6px}
.p-card p{font-size:.99rem;margin:0}
.p-card .why{padding-top:16px;border-top:1px solid var(--line)}
@media (min-width:1100px){.p-card .p-cols{display:grid;grid-template-columns:1fr 1fr;gap:28px}.p-card .why{padding-top:0;border-top:0;padding-left:28px;border-left:1px solid var(--line)}}


/* ---------- 03 Why (dark) ---------- */
.whysec{background:linear-gradient(180deg,var(--forest-3) 0%, var(--forest) 40%, var(--forest) calc(100% - 34vh), var(--sand) 100%);color:var(--ivory);padding-top:clamp(40px,6vw,80px);padding-bottom:calc(34vh + 40px)}
.whysec .eyebrow{color:var(--clay-light)}
.whysec h2{color:var(--ivory)}
.whysec .lead{color:var(--on-dark-muted)}
.why-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-dark)}
.why-list li{display:grid;grid-template-columns:3rem 1fr;gap:6px 18px;padding:28px 0;border-bottom:1px solid var(--line-dark)}
.why-list .n{font:italic 400 1.1rem/1.5 var(--serif);color:var(--clay-light)}
.why-list h3{font-size:clamp(1.8rem,3.2vw,2.4rem);font-style:italic;font-weight:400;color:var(--gold-soft);margin-bottom:10px}
.why-list p{color:var(--on-dark);margin:0;max-width:34em}

/* ---------- 04 Journey (pinned on capable devices) ---------- */
.journey{background:linear-gradient(180deg,var(--sand) 0%, var(--sand) calc(100% - 30vh), var(--ivory) 100%);padding-bottom:0}
.journey-head{max-width:46rem}
.steps{list-style:none;margin:0;padding:0;display:grid}
.step{position:relative;display:grid;grid-template-columns:44px 1fr;gap:0 18px}
.step .rail{position:relative;display:flex;flex-direction:column;align-items:center}
.node{width:44px;height:44px;flex:0 0 44px;border-radius:50%;display:grid;place-items:center;background:var(--white);border:1px solid var(--line);color:var(--forest);transition:background-color .35s,color .35s,border-color .35s}
.node svg{width:20px;height:20px}
.step-bar{position:relative;flex:1 1 auto;width:2px;margin:6px 0;background:rgba(37,70,56,.14);overflow:hidden;min-height:18px}
.step-bar i{position:absolute;inset:0;background:var(--forest);transform-origin:top;transform:scaleY(var(--p,0))}
.step:last-child .step-bar{display:none}
.step .k{font:italic 400 .95rem/1 var(--serif);color:var(--clay-ink);margin:12px 0 6px}
.step h3{font-size:1.4rem;margin:0 0 6px;color:var(--forest)}
.step p{font-size:.97rem;color:var(--muted);margin:0 0 22px;max-width:28em}
.step a.step-link{color:inherit;text-decoration:none}
.step a.step-link:hover h3{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.journey-count{display:none}
.journey-track{position:relative}

/* Static journey: no 3D or reduced motion -> a calm, fully readable list */
html:not(.can-3d) .journey-track{padding:0 0 clamp(80px,10vw,120px)}
html:not(.can-3d) .journey .stage{display:none}
html:not(.can-3d) .journey-grid{display:block}
@media (min-width:980px){
  html:not(.can-3d) .steps{grid-template-columns:repeat(3,1fr);gap:8px 32px}
}

/* Pinned journey */
.can-3d .journey-track{height:calc(100svh - var(--head) + 6 * var(--step-h))}
.can-3d .journey-pin{position:sticky;top:var(--head);height:calc(100svh - var(--head));display:flex;align-items:center}
.can-3d .journey-grid{display:grid;width:100%;height:100%;grid-template-columns:minmax(0,5fr) minmax(0,6fr);column-gap:clamp(32px,5vw,80px);align-items:center}
.can-3d .journey .stage{height:100%}
.can-3d .step{transition:opacity .45s var(--ease-out)}
.can-3d .step:not(.is-active):not(.is-done){opacity:.42}
.can-3d .step.is-done{opacity:.72}
.can-3d .step.is-active .node,.can-3d .step.is-done .node{background:var(--forest);color:var(--ivory);border-color:var(--forest)}
@media (max-width:899px){
  .can-3d .journey-grid{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;row-gap:0;align-items:end}
  .can-3d .journey .stage{grid-row:1;height:100%}
  .can-3d .journey-panel{grid-row:2;background:rgba(247,244,236,.94);border:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0;
    padding:20px 22px 22px;margin:0 calc(var(--gutter) * -1 + 8px);min-height:196px;box-shadow:0 -20px 40px -30px rgba(37,43,39,.3)}
  .can-3d .journey-count{display:block;font:600 .74rem/1 var(--sans);letter-spacing:.16em;color:var(--clay-ink);margin:0 0 12px}
  .can-3d .step:not(.is-active){position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .can-3d .step.is-active{opacity:1}
  .can-3d .step .step-bar{display:none}
  .can-3d .step .k{margin-top:4px}
  .can-3d .step p{margin:0}
  .journey-meter{display:flex;gap:6px;margin:0 0 16px}
}
.journey-meter{display:none}
@media (max-width:899px){.can-3d .journey-meter{display:flex}}
.journey-meter span{flex:1;height:3px;border-radius:2px;background:rgba(37,70,56,.14);overflow:hidden}
.journey-meter span i{display:block;height:100%;background:var(--forest);transform-origin:left;transform:scaleX(var(--p,0))}

/* ---------- Closing ---------- */
.closing{position:relative;text-align:center;padding:clamp(40px,6vw,80px) 0 clamp(90px,12vw,150px);
  background:radial-gradient(50% 40% at 50% 30%, #FFF8EA 0%, rgba(255,248,234,0) 70%), var(--ivory)}

.can-3d .closing-stage{height:min(56svh,540px)}

.closing h2 em{font-weight:400;color:var(--clay-ink)}
.closing p{color:var(--muted);max-width:34em;margin:0 auto 32px;font-size:1.1rem}
.closing .cta-row{justify-content:center}
.closing-kicker{justify-content:center}
.closing-kicker::before{content:"";flex:0 0 48px;height:1px;background:currentColor;opacity:.5}
.share-status{min-height:1.5em;margin:18px auto 0!important;font-size:.95rem!important;color:var(--leaf-ink)!important}
.word-reveal .w{opacity:var(--o,1);transition:opacity .2s linear}

/* ---------- Footer ---------- */
.site-footer{position:relative;background:var(--forest-2);color:var(--on-dark-muted);font-size:.94rem;padding:64px 0 40px}
.site-footer .cols{display:grid;gap:32px;grid-template-columns:1fr}
@media (min-width:860px){.site-footer .cols{grid-template-columns:1.5fr 1fr 1fr}}
.site-footer h2{font:600 .72rem/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--clay-light);margin:0 0 14px}
.site-footer .brand{color:var(--ivory);margin:0 0 14px}
.site-footer ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.site-footer a{color:var(--ivory);display:inline-block;padding:6px 0}
.site-footer .fine{margin-top:40px;padding-top:20px;border-top:1px solid rgba(247,244,236,.15);font-size:.84rem;color:#C2C7BC;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}

/* ---------- Floating controls ---------- */
.floating-controls{position:fixed;right:max(16px, env(safe-area-inset-right));bottom:max(16px, env(safe-area-inset-bottom));z-index:40;display:flex;gap:10px;align-items:center}
.to-top{border:0;cursor:pointer;background:var(--forest);color:var(--ivory);box-shadow:inset 0 0 0 1px rgba(247,244,236,.28),0 8px 24px rgba(28,55,44,.28);width:50px;height:50px;border-radius:50%;display:grid;place-items:center;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .25s,transform .25s var(--ease-out)}
.to-top.show{opacity:1;pointer-events:auto;transform:none}
.to-top svg{width:20px;height:20px}

noscript p{background:var(--sand);padding:16px;border-radius:12px;margin:90px var(--gutter) 24px}

/* ---------- Entrance reveals (only with JS and motion allowed) ---------- */
.js:not(.reduced-motion) .reveal{opacity:0;transform:translateY(22px);transition:opacity .9s var(--ease-out),transform .9s var(--ease-out)}
.js:not(.reduced-motion) .reveal.in{opacity:1;transform:none}
.js:not(.reduced-motion) .hero-copy > *{animation:rise 1.1s var(--ease-out) both}
.js:not(.reduced-motion) .hero-copy > :nth-child(2){animation-delay:.08s}
.js:not(.reduced-motion) .hero-copy > :nth-child(3){animation-delay:.16s}
.js:not(.reduced-motion) .hero-copy > :nth-child(4){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
  .grain-canvas{transition:none}
}

@media print{
  .site-header,.floating-controls,.grain-canvas{display:none!important}
  .hero{min-height:auto}
  .stage{display:none!important}
  .journey-track{height:auto!important}
  .journey-pin{position:static!important;height:auto!important}
}

/* Soft floor shadow under the floating hero grain */
.can-3d .hero .hero-stage::after{content:"";position:absolute;left:50%;bottom:7%;width:min(46%,280px);height:30px;transform:translateX(-50%);
  background:radial-gradient(50% 50% at 50% 50%, rgba(122,75,38,.22), rgba(122,75,38,0) 70%);filter:blur(4px);opacity:0;transition:opacity 1.2s ease}
.has-3d .hero .hero-stage::after{opacity:var(--shadow,1)}
@media (max-width:899px){.can-3d .hero .hero-stage::after{bottom:2%;height:20px}}

/* Mobile: the grain shares the full width with the text, so text blocks become full-bleed
   "paper" layers in their section's colour and the grain passes behind them. */
@media (max-width:899px){
  .can-3d .chapter-head,.can-3d .p-intro,.can-3d .why-list li,.can-3d .closing-copy{
    background:var(--paper);box-shadow:0 0 0 100vmax var(--paper);clip-path:inset(0 -100vmax)}
  #farmers{--paper:var(--ivory)}
  .practices{--paper:var(--field);background:linear-gradient(180deg,#F6F2E8 0,var(--field) 72px,var(--field) calc(100% - 36vh),var(--forest-3) 100%)}
  .can-3d .p-intro{margin-bottom:0;padding-bottom:28px;border-left:0;padding-left:0}
  .whysec{--paper:var(--forest);background:linear-gradient(180deg,var(--forest) 0,var(--forest) calc(100% - 34vh),var(--sand) 100%)}
  .journey{--paper:var(--sand)}
  .closing{--paper:var(--ivory)}
  .can-3d .chapter-head{margin-bottom:0;padding-bottom:clamp(30px,5vw,48px)}
}
@media (max-width:520px){.closing-kicker::before,.closing-kicker::after{flex-basis:22px}}

<a class="skip" href="#main">Skip to content</a>

<!-- The 3D grain. Decorative: the whole story is told in the text. -->
<canvas class="grain-canvas" id="grainCanvas" aria-hidden="true"></canvas>

<header class="site-header" id="siteHeader">
  <div class="wrap bar">
    <a class="brand" href="#top" aria-label="Home - back to the top">
      <svg viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M16 29V13"/><path d="M16 13c0-4 2-7.5 5.5-9.5"/><ellipse cx="11.5" cy="12" rx="2" ry="4.6" transform="rotate(-28 11.5 12)"/><ellipse cx="20.5" cy="15" rx="2" ry="4.6" transform="rotate(28 20.5 15)"/><ellipse cx="11.5" cy="19.5" rx="2" ry="4.6" transform="rotate(-28 11.5 19.5)"/><ellipse cx="20.5" cy="22.5" rx="2" ry="4.6" transform="rotate(28 20.5 22.5)"/></svg>
      <span class="brand-name"></span>
    </a>
    <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="mainNav">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path class="i-open" d="M3 6h14M3 10h14M3 14h14"/><path class="i-close" d="M5 5l10 10M15 5 5 15"/></svg>
      <span>Menu</span>
    </button>
    <nav class="mainnav" id="mainNav" aria-label="Main">
      <ul id="navList"></ul>
    </nav>
  </div>
  <div class="progress" aria-hidden="true"><span id="progress"></span></div>
</header>

<section class="hero" id="top" aria-labelledby="heroTitle" data-tone="light">
  <div class="hero-stage stage" id="heroStage" aria-hidden="true">
    <!-- Shown until the 3D grain is ready, and instead of it where 3D is unavailable. -->
    <svg class="grain-fallback" viewBox="0 0 200 520" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gfBody" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#D9CDB4"/><stop offset=".38" stop-color="#FBF7EE"/><stop offset=".62" stop-color="#F3ECDD"/><stop offset="1" stop-color="#C9BA9C"/>
        </linearGradient>
        <radialGradient id="gfGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF8EA"/><stop offset="1" stop-color="#FFF8EA" stop-opacity="0"/></radialGradient>
        <linearGradient id="gfShine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".45" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      </defs>
      <ellipse cx="100" cy="260" rx="98" ry="250" fill="url(#gfGlow)"/>
      <g transform="rotate(14 100 260)">
        <path d="M100 38c26 0 38 70 38 168 0 112-12 248-38 276-27-28-39-164-39-276C61 108 74 38 100 38Z" fill="url(#gfBody)"/>

        <path d="M117 440c-6 14-11 24-17 30" stroke="#BFAE8E" stroke-width="2" stroke-linecap="round" fill="none" opacity=".6"/>
      </g>
    </svg>
  </div>
  <div class="wrap hero-copy">
    <p class="deva" id="heroDeva" lang="hi"></p>
    <h1 id="heroTitle"></h1>
    <p class="lead" id="heroLead"></p>
    <div class="cta-row">
      <a class="btn" href="#farmers" id="heroCta">
        <span></span>
        <svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v14M4 11l6 6 6-6"/></svg>
      </a>
      <a class="textlink" href="#practices" id="heroLink"></a>
    </div>
  </div>
</section>

<main id="main">
  <noscript><p>Please turn on JavaScript to see the full story of the farmers and practices behind this rice.</p></noscript>

  <!-- 01 The people -->
  <section class="chapter chapter--stage-left" id="farmers" aria-labelledby="farmersTitle" data-tone="light">
    <div class="wrap chapter-grid">
      <header class="chapter-head reveal">
        <p class="eyebrow"><span class="num" data-ch="farmers.num"></span> <span data-ch="farmers.label"></span></p>
        <h2 id="farmersTitle" data-ch="farmers.title"></h2>
        <p class="lead" id="farmersLead"></p>
      </header>
      <div class="stage-col"><div class="stage" data-stage="farmers"></div></div>
      <div class="chapter-body">
        <div id="farmerProfiles"></div>
        <div class="mvs reveal" id="mvs"></div>
      </div>
    </div>
  </section>

  <!-- 02 In the field -->
  <section class="chapter chapter--stage-left practices" id="practices" aria-labelledby="practicesTitle" data-tone="field">
    <div class="wrap chapter-grid">
      <header class="chapter-head reveal">
        <p class="eyebrow"><span class="num" data-ch="practices.num"></span> <span data-ch="practices.label"></span></p>
        <h2 id="practicesTitle" data-ch="practices.title"></h2>
        <p class="lead" id="practicesLead"></p>
      </header>
      <div class="stage-col">
        <div class="stage" data-stage="practices"></div>
      </div>
      <div class="chapter-body">
        <div class="p-intro reveal" id="practiceIntro"></div>
        <div class="p-list" id="practiceList"></div>
      </div>
    </div>
  </section>

  <!-- 03 The reasons -->
  <section class="chapter chapter--stage-right whysec" id="why" aria-labelledby="whyTitle" data-tone="dark">
    <div class="wrap chapter-grid">
      <header class="chapter-head reveal">
        <p class="eyebrow"><span class="num" data-ch="why.num"></span> <span data-ch="why.label"></span></p>
        <h2 id="whyTitle" data-ch="why.title"></h2>
        <p class="lead" id="whyLead"></p>
      </header>
      <div class="stage-col"><div class="stage" data-stage="why"></div></div>
      <div class="chapter-body">
        <ol class="why-list" id="whyList"></ol>
      </div>
    </div>
  </section>

  <!-- 04 The journey: a pinned sequence, one step at a time -->
  <section class="chapter journey" id="journey" aria-labelledby="journeyTitle" data-tone="sand">
    <div class="wrap">
      <header class="chapter-head journey-head reveal">
        <p class="eyebrow"><span class="num" data-ch="journey.num"></span> <span data-ch="journey.label"></span></p>
        <h2 id="journeyTitle" data-ch="journey.title"></h2>
        <p class="lead" id="journeyLead"></p>
      </header>
    </div>
    <div class="journey-track" id="journeyTrack">
      <div class="journey-pin">
        <div class="wrap journey-grid">
          <div class="journey-panel">
            <p class="journey-count" aria-hidden="true"><span id="journeyNow">1</span> / <span id="journeyTotal">6</span></p>
            <ol class="steps" id="steps"></ol>
          </div>
          <div class="stage" data-stage="journey"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="closing" id="closing" aria-labelledby="closeTitle" data-tone="light">
    <div class="stage closing-stage" data-stage="closing"></div>
    <div class="wrap closing-copy">
      <p class="eyebrow closing-kicker" id="closeKicker"></p>
      <h2 id="closeTitle" class="word-reveal"></h2>
      <p id="closeText" class="reveal"></p>
      <div class="cta-row reveal" id="closeCtas"></div>
      <p class="share-status" id="shareStatus" role="status" aria-live="polite"></p>
    </div>
  </section>
</main>

<footer class="site-footer" id="siteFooter">
  <div class="wrap">
    <div class="cols" id="footerCols"></div>
    <div class="fine" id="footerFine"></div>
  </div>
</footer>

  <button class="to-top" id="toTop" type="button" aria-label="Back to top">

  </button>

    mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
    share:'<circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="m8.2 10.8 7.6-4.1M8.2 13.2l7.6 4.1"/>'
  };
  const icon = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k] || ""}</svg>`;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const rich = (s) => esc(s).replace(/&lt;(\/?)em&gt;/g, "<$1em>");
  const plain = (s) => String(s ?? "").replace(/<\/?em>/g, "");
  const has = (s) => typeof s === "string" && s.trim() !== "";
  const safeUrl = (u) => /^(https:\/\/|assets\/)/.test(u || "") ? u : "";
  const pad = (n) => String(n).padStart(2, "0");
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const get = (path) => path.split(".").reduce((o, k) => (o == null ? o : o[k]), C.chapters || {});

  /* Real photos: only shown when configured, and removed again if they fail to load. */
  function photoHtml(photo, i) {
    const url = safeUrl(photo && photo.src);
    return url ? `<div class="photo"><img src="${esc(url)}" alt="${esc(photo.alt || "")}" loading="lazy" decoding="async" data-photo="${i}"></div>` : "";
  }

  function render() {
    const S = C.site;
    document.querySelectorAll(".brand-name").forEach(el => el.textContent = S.brandName);
    $("navList").innerHTML = C.nav.map(n => `<li><a href="${esc(n.href)}">${esc(n.label)}</a></li>`).join("");
    document.querySelectorAll("[data-ch]").forEach(el => { el.textContent = get(el.dataset.ch) || ""; });

    /* Hero */
    $("heroDeva").textContent = C.hero.deva;
    $("heroTitle").innerHTML = rich(C.hero.headline);
    $("heroLead").textContent = C.hero.lead;
    $("heroCta").querySelector("span").textContent = C.hero.cta;
    $("heroLink").textContent = C.hero.link;

    /* 01 Farmers */
    $("farmersLead").textContent = C.farmersLead;
    $("farmerProfiles").innerHTML = C.farmers.map((f, i) => {
      const facts = (f.facts || []).filter(r => has(r[1]));
      return `<article class="farmer reveal" aria-labelledby="farmerName${i}">
        ${photoHtml(f.photo, i)}
        <div class="farmer-body">
          ${has(f.kicker) ? `<p class="kicker">${esc(f.kicker)}</p>` : ""}
          <h3 id="farmerName${i}">${esc(f.name)}</h3>
          ${has(f.place) ? `<p class="place">${esc(f.place)}</p>` : ""}
          ${has(f.story) ? `<p class="story">${esc(f.story)}</p>` : ""}
          ${facts.length ? `<ul class="facts">${facts.map(r => `<li><span>${esc(r[0])}</span><span>${esc(r[1])}</span></li>`).join("")}</ul>` : ""}
          ${has(f.quote) ? `<blockquote class="quote">“${esc(f.quote)}”${has(f.quoteBy) ? `<cite>${esc(f.quoteBy)}</cite>` : ""}</blockquote>` : ""}
        </div></article>`;
    }).join("");
    document.querySelectorAll("img[data-photo]").forEach(img => img.addEventListener("error", () => img.parentElement.remove(), { once: true }));

    $("mvs").innerHTML = `<h3>${esc(C.mvs.title)}</h3><p class="mvs-intro">${esc(C.mvs.intro)}</p>
      <ul>${C.mvs.items.map(m => `<li>${icon(m.icon)}<b>${esc(m.title)}</b><p>${esc(m.text)}</p></li>`).join("")}</ul>`;

    /* 02 Practices */
    $("practicesLead").textContent = C.practicesLead;
    $("practiceIntro").innerHTML = `<h3>${esc(C.practiceIntro.title)}</h3><p>${esc(C.practiceIntro.text)}</p>`;
    $("practiceList").innerHTML = C.practices.map((p, i) => `
      <article class="p-card reveal" id="practice-${esc(p.id)}" aria-labelledby="ph-${esc(p.id)}">
        <div class="p-top"><span class="p-theme">${icon(p.icon)}${esc(p.theme)}</span><span class="p-num" aria-hidden="true">${pad(i + 1)} / ${pad(C.practices.length)}</span></div>
        <h3 id="ph-${esc(p.id)}">${esc(p.title)}</h3>
        <div class="p-cols">
          <div><p class="p-label">In the field</p><p>${esc(p.does)}</p></div>
          <div class="why"><p class="p-label">Why it matters</p><p>${esc(p.why)}</p></div>
        </div>
      </article>`).join("");

    /* 03 Why */
    $("whyLead").textContent = C.whyLead;
    $("whyList").innerHTML = C.why.map((w, i) =>
      `<li class="reveal"><span class="n" aria-hidden="true">${pad(i + 1)}</span><div><h3>${esc(w.title)}</h3><p>${esc(w.text)}</p></div></li>`).join("");

    /* 04 Journey */
    $("journeyLead").textContent = C.journeyLead;
    $("journeyTotal").textContent = C.journey.length;
    $("steps").innerHTML = C.journey.map((s, i) => `<li class="step" data-step="${i}">
        <div class="rail" aria-hidden="true"><span class="node">${icon(s.icon)}</span><span class="step-bar"><i></i></span></div>
        <div class="step-body"><p class="k">Step ${i + 1}</p><h3><a class="step-link" href="#journey" data-goto="${i}">${esc(s.name)}</a></h3><p>${esc(s.text)}</p></div>
      </li>`).join("");
    const meter = document.createElement("div");
    meter.className = "journey-meter";
    meter.setAttribute("aria-hidden", "true");
    meter.innerHTML = C.journey.map(() => "<span><i></i></span>").join("");
    $("steps").before(meter);

    /* Closing - the heading is revealed word by word as you scroll */
    if (has(C.closing.kicker)) $("closeKicker").textContent = C.closing.kicker; else $("closeKicker").remove();
    const title = $("closeTitle");
    title.setAttribute("aria-label", plain(C.closing.title));
    let em = false;
    title.innerHTML = C.closing.title.split(/(<\/?em>)/).map(part => {
      if (part === "<em>") { em = true; return ""; }
      if (part === "</em>") { em = false; return ""; }
      return part.split(/(\s+)/).map(w => /^\s+$/.test(w) || !w ? w : (em ? `<em class="w" aria-hidden="true">${esc(w)}</em>` : `<span class="w" aria-hidden="true">${esc(w)}</span>`)).join("");
    }).join("");
    $("closeText").textContent = C.closing.text;
    /* Gentle next steps: where to buy and contact appear only once they are filled in. */
    const mail = has(S.contactEmail) ? "mailto:" + S.contactEmail.trim() : "";
    const buy = safeUrl(C.closing.buyUrl);
    $("closeCtas").innerHTML =
      (buy ? `<a class="btn" href="${esc(buy)}" rel="noopener" target="_blank">${icon("pack")}<span>${esc(C.closing.buyLabel || "Where to buy")}</span></a>` : "")
      + `<button class="btn ${buy ? "ghost" : ""}" type="button" id="shareBtn">${icon("share")}<span>${esc(C.closing.shareLabel || "Share this story")}</span></button>`
      + (mail ? `<a class="btn ghost" href="${esc(mail)}">${icon("mail")}<span>Get in touch</span></a>` : "");

    /* Footer: only show contact details that exist */
    const contact = [
      mail ? `<li><a href="${esc(mail)}">${esc(S.contactEmail)}</a></li>` : "",
      has(S.contactPhone) ? `<li><a href="tel:${esc(S.contactPhone.replace(/[^+\d]/g, ""))}">${esc(S.contactPhone)}</a></li>` : "",
      safeUrl(S.website) ? `<li><a href="${esc(S.website)}" rel="noopener">${esc(S.website.replace(/^https:\/\//, ""))}</a></li>` : ""
    ].join("");
    const logo = document.querySelector("#siteHeader .brand svg").outerHTML;
    $("footerCols").innerHTML = `
      <div><p class="brand">${logo}<span>${esc(S.brandName)}</span></p><p>${esc(C.footer.about)}</p></div>
      <div><h2>Explore</h2><ul>${C.nav.map(n => `<li><a href="${esc(n.href)}">${esc(n.label)}</a></li>`).join("")}</ul></div>
      <div><h2>${contact ? "Contact" : "In partnership with"}</h2>${contact ? `<ul>${contact}</ul>` : `<p>${esc(S.partnerName)}</p>`}</div>`;
    $("footerFine").innerHTML = `<span>© ${esc(S.year)} ${esc(S.brandName)}</span><span>${esc(C.footer.statutory)}</span>`;
  }

  /* ---------------------------------------------------------------------
     Story map: where each chapter of the 3D story sits on the page.
     The scene interpolates between these keyframes as you scroll.
     --------------------------------------------------------------------- */
  const Story = {
    version: 0,
    keyframes: [],
    content: C,
    reduced: () => RM.matches,
    pinned: () => root.classList.contains("can-3d")
  };
  window.MVSStory = Story;

  const headH = () => $("siteHeader").offsetHeight || 68;
  const docTop = (el) => el.getBoundingClientRect().top + scrollY;
  function stickyAncestor(el) {
    for (let n = el; n && n !== document.body; n = n.parentElement) if (getComputedStyle(n).position === "sticky") return n;
    return null;
  }
  /* Where the grain should sit on screen (0-1) when this keyframe is active, and how much room it has. */
  function focusOf(stage, y) {
    const vw = innerWidth, vh = innerHeight, r = stage.getBoundingClientRect();
    let top;
    const sticky = stickyAncestor(stage);
    if (sticky) top = headH() + (r.top - sticky.getBoundingClientRect().top);
    else top = r.top + scrollY - y;
    const h = r.height || vh * 0.5;
    return {
      fx: clamp((r.left + r.width / 2) / vw, 0.1, 0.9),
      fy: clamp((top + h / 2) / vh, 0.12, 0.88),
      fw: clamp(r.width / vw, 0.25, 1),
      fh: clamp(h / vh, 0.25, 1)
    };
  }
  const centerScroll = (el) => docTop(el) + el.offsetHeight / 2 - innerHeight / 2;

  function journeyGeometry() {
    const track = $("journeyTrack"), pin = track.querySelector(".journey-pin");
    const n = C.journey.length;
    const start = docTop(track) - headH();
    const stepH = Math.max(1, (track.offsetHeight - pin.offsetHeight) / n);
    return { start, stepH, n };
  }

  function computeKeyframes() {
    if (!root.classList.contains("can-3d")) { Story.keyframes = []; Story.version++; return; }
    const desk = DESKTOP.matches, vh = innerHeight, head = headH();
    const maxY = Math.max(1, document.documentElement.scrollHeight - vh);
    const q = (s) => document.querySelector(s);
    const kf = [];
    const add = (key, y, stage, ease) => kf.push(Object.assign({ key, y, ease: ease || "plateau" }, focusOf(stage, y)));
    const chapterY = (id) => {
      const stage = q(`[data-stage="${id}"]`);
      return desk ? docTop(stage.parentElement) - head + vh * 0.12 : centerScroll(stage);
    };

    add("hero", 0, $("heroStage"));
    add("farmers", chapterY("farmers"), q('[data-stage="farmers"]'));
    const cards = document.querySelectorAll(".p-card");
    add("practicesA", chapterY("practices"), q('[data-stage="practices"]'));
    add("practicesB", centerScroll(cards[cards.length - 1]), q('[data-stage="practices"]'), "linear");
    add("why", chapterY("why"), q('[data-stage="why"]'));
    const J = journeyGeometry(), jStage = q('[data-stage="journey"]');
    for (let i = 0; i < J.n; i++) add("journey" + i, J.start + (i + 0.5) * J.stepH, jStage);
    const closingStage = q('[data-stage="closing"]');
    const closeY = centerScroll(closingStage);
    add("closing", closeY, closingStage);
    add("end", Math.max(closeY + vh * 0.3, docTop($("siteFooter")) - vh * 0.55), closingStage);

    /* Keep keyframes inside the scrollable range and strictly increasing. */
    let prev = -Infinity;
    kf.forEach((k, i) => {
      k.y = clamp(k.y, 0, maxY);
      if (i === 0) k.y = 0;
      if (k.y <= prev) k.y = prev + 1;
      prev = k.y;
    });
    Story.keyframes = kf;
    Story.version++;
  }

  /* ---------------------------------------------------------------------
     Navigation, progress, pinned journey and word reveal - one scroll loop
     --------------------------------------------------------------------- */
  function initNav() {
    const header = $("siteHeader"), btn = $("menuBtn");
    const setMenu = (open) => {
      header.classList.toggle("open", open);
      btn.setAttribute("aria-expanded", String(open));
      btn.querySelector("span").textContent = open ? "Close" : "Menu";
    };
    btn.addEventListener("click", () => setMenu(btn.getAttribute("aria-expanded") !== "true"));
    $("mainNav").addEventListener("click", (e) => { if (e.target.closest("a")) setMenu(false); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && header.classList.contains("open")) { setMenu(false); btn.focus(); } });
    document.addEventListener("click", (e) => { if (header.classList.contains("open") && !header.contains(e.target)) setMenu(false); });

    $("toTop").addEventListener("click", () => {
      scrollTo({ top: 0, behavior: RM.matches ? "auto" : "smooth" });
      $("top").setAttribute("tabindex", "-1"); $("top").focus({ preventScroll: true });
    });

    /* Highlight the section on screen in the menu */
    if ("IntersectionObserver" in window) {
      const spy = (links, attr) => {
        const targets = links.map(a => document.querySelector(a.getAttribute(attr))).filter(Boolean);
        const io = new IntersectionObserver((entries) => entries.forEach(en => {
          if (en.isIntersecting) links.forEach(a => a.setAttribute("aria-current", String(a.getAttribute(attr) === "#" + en.target.id)));
        }), { rootMargin: "-45% 0px -50% 0px" });
        targets.forEach(t => io.observe(t));
      };
      spy([...document.querySelectorAll("#navList a")], "href");
    }
  }

  function initReveal() {
    const els = document.querySelectorAll(".reveal");
    if (RM.matches || !("IntersectionObserver" in window)) { els.forEach(e => e.classList.add("in")); return; }
    const io = new IntersectionObserver((entries) => entries.forEach(en => {
      if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); }
    }), { rootMargin: "0px 0px -8% 0px", threshold: 0.12 });
    els.forEach(e => io.observe(e));
  }

  /* Word reveal (pattern adapted from Motion's "Scroll word reveal" on 21st.dev):
     each word rises from a resting opacity as the heading moves up the screen. */
  const REST = 0.22, SPAN = 0.8, WINDOW = 0.2;
  function updateWords() {
    const title = $("closeTitle"), words = title.querySelectorAll(".w");
    if (RM.matches) { words.forEach(w => w.style.removeProperty("--o")); return; }
    const r = title.getBoundingClientRect(), vh = innerHeight;
    const atEnd = scrollY >= document.documentElement.scrollHeight - vh - 2;   // always finish at the bottom
    const p = atEnd ? 1 : clamp((vh * 0.95 - r.top) / (vh * 0.42), 0, 1);   // fully revealed by mid-screen
    words.forEach((w, i) => {
      const s = words.length <= 1 ? 0 : (i / (words.length - 1)) * SPAN, e = Math.min(1, s + WINDOW);
      const o = p <= s ? REST : p >= e ? 1 : REST + (1 - REST) * ((p - s) / (e - s));
      w.style.setProperty("--o", o.toFixed(3));
    });
  }

  /* Pinned farm-to-pack sequence (pattern adapted from "Scroll Reveal Content A" on 21st.dev):
     numbered steps with a progress line that fills as you scroll through each one. */
  let activeStep = -1;
  function updateJourney() {
    if (!root.classList.contains("can-3d")) return;
    const J = journeyGeometry();
    const p = clamp((scrollY - J.start) / (J.n * J.stepH), 0, 0.99999);
    const idx = Math.floor(p * J.n), local = p * J.n - idx;
    const items = $("steps").children, segs = document.querySelectorAll(".journey-meter i");
    for (let i = 0; i < items.length; i++) {
      const v = i < idx ? 1 : i === idx ? local : 0;
      items[i].querySelector(".step-bar i").style.setProperty("--p", v.toFixed(3));
      if (segs[i]) segs[i].style.setProperty("--p", (i < idx ? 1 : i === idx ? Math.max(0.08, local) : 0).toFixed(3));
    }
    if (idx !== activeStep) {
      activeStep = idx;
      for (let i = 0; i < items.length; i++) {
        items[i].classList.toggle("is-active", i === idx);
        items[i].classList.toggle("is-done", i < idx);
        if (i === idx) items[i].setAttribute("aria-current", "step"); else items[i].removeAttribute("aria-current");
      }
      $("journeyNow").textContent = idx + 1;
    }
  }
  function initJourneyLinks() {
    $("steps").addEventListener("click", (e) => {
      const a = e.target.closest("[data-goto]");
      if (!a || !root.classList.contains("can-3d")) return;
      e.preventDefault();
      const J = journeyGeometry(), i = +a.dataset.goto;
      scrollTo({ top: J.start + (i + 0.5) * J.stepH, behavior: RM.matches ? "auto" : "smooth" });
    });
  }

  let ticking = false;
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      const y = scrollY, h = document.documentElement.scrollHeight - innerHeight;
      $("siteHeader").classList.toggle("solid", y > 40);
      $("toTop").classList.toggle("show", y > innerHeight * 0.9);
      $("progress").style.transform = `scaleX(${h > 0 ? clamp(y / h, 0, 1) : 0})`;
      $("heroStage").style.setProperty("--shadow", clamp(1 - y / (innerHeight * 0.3), 0, 1).toFixed(3));
      updateJourney();
      updateWords();
    });
  }

  /* ---------------------------------------------------------------------
     Share: the native share sheet where there is one, otherwise copy the link.
     --------------------------------------------------------------------- */
  function initShare() {
    const btn = $("shareBtn"), status = $("shareStatus");
    if (!btn) return;
    const data = { title: document.title, text: C.closing.shareText || "", url: location.href.split("#")[0] };
    btn.addEventListener("click", async () => {
      try {
        if (navigator.share) { await navigator.share(data); return; }
        await navigator.clipboard.writeText(data.url);
        status.textContent = "Link copied - thank you for sharing.";
      } catch (e) {
        if (e && e.name === "AbortError") return;
        status.textContent = "Copy this link to share: " + data.url;
      }
      setTimeout(() => { status.textContent = ""; }, 5000);
    });
  }

  /* ---------------------------------------------------------------------
     3D grain: loaded after the page is readable; falls back gracefully.
     --------------------------------------------------------------------- */
  function disable3d(reason) {
    if (reason) console.warn("[MVS] 3D grain unavailable:", reason);
    root.classList.remove("can-3d", "has-3d");
    computeKeyframes();
    onScroll();
  }
  function load3d() {
    if (!root.classList.contains("can-3d")) return;
    /* The single-file build (npm run build:standalone) inlines the scene as window.MVSGrainScene. */
    const url = new URL("grain-scene.js", SCRIPT_SRC || location.href).href;
    const scene = window.MVSGrainScene ? Promise.resolve(window.MVSGrainScene) : import(url);
    scene.then((m) => m.start({
      canvas: $("grainCanvas"),
      story: Story,
      onReady: () => root.classList.add("has-3d"),
      onFail: disable3d
    })).catch(disable3d);
  }

  /* ---------------------------------------------------------------------
     Boot
     --------------------------------------------------------------------- */
  render();
  initNav();
  initReveal();
  initJourneyLinks();
  initShare();
  computeKeyframes();
  onScroll();
  addEventListener("scroll", onScroll, { passive: true });

  let resizeTimer = 0, lastW = innerWidth, lastH = innerHeight;
  addEventListener("resize", () => {
    /* Ignore the small height changes mobile browsers make when the address bar slides. */
    const touch = matchMedia("(pointer: coarse)").matches;
    if (touch && innerWidth === lastW && Math.abs(innerHeight - lastH) < 140) return;
    lastW = innerWidth; lastH = innerHeight;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { computeKeyframes(); onScroll(); }, 120);
  });
  RM.addEventListener && RM.addEventListener("change", () => {
    root.classList.toggle("reduced-motion", RM.matches);
    computeKeyframes(); onScroll();
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { computeKeyframes(); onScroll(); });
  addEventListener("load", () => { computeKeyframes(); onScroll(); });
  if ("ResizeObserver" in window) {
    let raf = 0;
    new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(computeKeyframes); }).observe($("main"));
  }

  /* Start the 3D scene once the browser is idle, so text and layout always come first. */
  const idle = window.requestIdleCallback || ((fn) => setTimeout(fn, 200));
  idle(load3d, { timeout: 1200 });
})();

</script>
</body>
</html>
