    <text x="352" y="248" font-family="'Playfair Display', Georgia, serif" font-size="22" fill="#103F30">Prove the proposition</text>
    <line x1="352" y1="264" x2="600" y2="264" stroke="#795C43" stroke-width="1"/>
    <g font-size="15" fill="#292D2A">
