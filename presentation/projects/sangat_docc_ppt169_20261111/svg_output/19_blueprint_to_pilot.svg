    <text x="56" y="248" font-family="'Playfair Display', Georgia, serif" font-size="22" fill="#103F30">Prove the product</text>
    <line x1="56" y1="264" x2="304" y2="264" stroke="#795C43" stroke-width="1"/>
    <g font-size="15" fill="#292D2A">
      <text x="56" y="296">Product specification and
        <tspan x="56" dy="20">batch consistency</tspan></text>
      <text x="56" y="358">Farm, season and sourcing
        <tspan x="56" dy="20">records</tspan></text>
      <text x="56" y="420">SRP status and approved
        <tspan x="56" dy="20">claim wording</tspan></text>
      <text x="56" y="482">Packaging compliance;
        <tspan x="56" dy="20">every placeholder replaced</tspan></text>
    </g>
  </g>
  <g id="p19-arrow-1" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="rightArrow" data-pptx-frame="318 300 24 36" fill="#C6A65A" stroke="none">
