      <text x="952" y="430"><tspan font-weight="600" fill="#103F30">Go</tspan> — build on the foundation;
        <tspan x="952" dy="19">Delhi NCR could follow</tspan></text>
      <text x="952" y="484"><tspan font-weight="600" fill="#795C43">Adjust</tspan> — let the pilot show
        <tspan x="952" dy="19">what needs to change</tspan></text>
      <text x="952" y="538"><tspan font-weight="600" fill="#5F655F">Stop</tspan> — if the evidence does
        <tspan x="952" dy="19">not support the proposition</tspan></text>
