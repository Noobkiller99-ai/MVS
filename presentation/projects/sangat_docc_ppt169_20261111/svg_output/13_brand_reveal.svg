<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="en-IN" data-pptx-page-role="content" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F6F1E5"/>
  <g id="header" data-pptx-bounds="56 36 1168 104">
    <text x="56" y="60" font-size="12" font-weight="600" letter-spacing="2" fill="#795C43">ACT IV · BUILDING SANGAT</text>
    <rect x="56" y="72" width="40" height="2" fill="#C6A65A"/>
    <text x="56" y="122" font-family="'Playfair Display', Georgia, serif" font-size="38" fill="#103F30">Sangat: a name rooted <tspan font-style="italic" fill="#795C43">in togetherness.</tspan></text>
  </g>
  <g id="logo-panel" data-pptx-bounds="56 156 520 270">
    <rect x="56" y="160" width="520" height="262" fill="#FBF8F1"/>
    <rect x="56" y="160" width="520" height="262" fill="none" stroke="#D6CDB8" stroke-width="1"/>
    <image id="logo-col" href="../images/logo_primary_colour.png" x="96" y="176" width="440" height="227" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="meaning" data-pptx-bounds="56 440 520 226">
    <text x="56" y="464" font-size="12" font-weight="600" letter-spacing="2" fill="#795C43">THE IDEA</text>
    <text x="56" y="496" font-family="'Playfair Display', Georgia, serif" font-size="20" fill="#103F30"><tspan font-style="italic">Sangat</tspan> — company, togetherness:
      <tspan x="56" dy="27">farmers, MVS and households, connected</tspan>
      <tspan x="56" dy="27">through the food they grow and cook.</tspan></text>
    <text x="56" y="594" font-size="16" fill="#292D2A"><tspan font-weight="600" fill="#103F30">Sanjhi Soch, Sunehra Kal</tspan> — shared thinking
      <tspan x="56" dy="23">for a brighter tomorrow.</tspan></text>
    <text x="56" y="652" font-size="13" fill="#5F655F">Uses the broad meaning of togetherness; no religious iconography.</text>
  </g>
  <g id="name-preference" data-pptx-bounds="608 156 616 238">
    <text x="608" y="178" font-size="12" font-weight="600" letter-spacing="2" fill="#795C43">NAME PREFERENCE · n = 20 (12 CONSUMERS, 8 RETAILERS)</text>
    <line x1="608" y1="190" x2="1224" y2="190" stroke="#D6CDB8" stroke-width="1"/>
    <g font-family="'Playfair Display', Georgia, serif" font-size="18" fill="#292D2A">
      <text x="608" y="224" fill="#103F30">Sangat</text>
      <text x="608" y="260">Mehak</text>
      <text x="608" y="296">Sanjha</text>
      <text x="608" y="332">Sajora</text>
    </g>
    <rect x="728" y="208" width="360" height="22" fill="#103F30"/>
    <rect x="728" y="244" width="120" height="22" fill="#CFC5AE"/>
    <rect x="728" y="280" width="90" height="22" fill="#CFC5AE"/>
    <rect x="728" y="316" width="30" height="22" fill="#CFC5AE"/>
    <g font-size="14" fill="#292D2A">
      <text x="1098" y="224" font-weight="600" fill="#103F30">12 · 60%</text>
      <text x="858" y="260">4 · 20%</text>
      <text x="828" y="296">3 · 15%</text>
      <text x="768" y="332">1 · 5%</text>
    </g>
    <text x="608" y="372" font-size="14" fill="#5F655F">Sangat led with consumers (7 of 12) and retailers (5 of 8).</text>
  </g>
  <g id="tagline-preference" data-pptx-bounds="608 404 616 186">
    <text x="608" y="424" font-size="12" font-weight="600" letter-spacing="2" fill="#795C43">TAGLINE PREFERENCE · n = 20</text>
    <line x1="608" y1="436" x2="1224" y2="436" stroke="#D6CDB8" stroke-width="1"/>
    <g font-size="15" fill="#292D2A">
      <text x="608" y="462" font-weight="600" fill="#103F30">Sanjhi Soch, Sunehra Kal</text>
      <text x="608" y="512">Punjab Se, Bharose Ke Saath</text>
      <text x="608" y="562">Achhi Fasal, Behtar Kal</text>
    </g>
    <rect x="608" y="470" width="390" height="18" fill="#103F30"/>
    <rect x="608" y="520" width="120" height="18" fill="#CFC5AE"/>
    <rect x="608" y="570" width="90" height="18" fill="#CFC5AE"/>
    <g font-size="14" fill="#292D2A">
      <text x="1008" y="484" font-weight="600" fill="#103F30">13 · 65%</text>
      <text x="738" y="534">4 · 20%</text>
      <text x="708" y="584">3 · 15%</text>
    </g>
  </g>
  <g id="caveat" data-pptx-bounds="608 600 616 66">
    <text x="608" y="620" font-size="13" fill="#5F655F">Exploratory: a small sample without recruitment details. It supports the
      <tspan x="608" dy="18">working name and tagline; it does not establish purchase intent or</tspan>
      <tspan x="608" dy="18">willingness to pay.</tspan></text>
  </g>
  <g id="footer" data-pptx-role="footer" data-pptx-bounds="56 674 1168 26" font-size="12" fill="#5F655F">
    <text x="56" y="692">Naming and tagline research, MVS project report §8.3–8.5; cultural note §9.3</text>
    <text x="1224" y="692" text-anchor="end">13 / 22</text>
  </g>
</svg>
