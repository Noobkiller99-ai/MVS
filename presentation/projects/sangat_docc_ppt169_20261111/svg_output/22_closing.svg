<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="en-IN" data-pptx-page-role="ending" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="landFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#103F30" stop-opacity="1"/>
      <stop offset="45%" stop-color="#103F30" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#103F30" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#103F30"/>
  <image id="landscape" data-pptx-role="background" href="../images/art_landscape.png" x="0" y="500" width="1280" height="220" preserveAspectRatio="xMidYMax slice"/>
  <rect id="landscape-fade" data-pptx-role="decoration" x="0" y="500" width="1280" height="110" fill="url(#landFade)"/>
  <g id="symbol" data-pptx-bounds="600 36 80 112">
    <image id="logo-sym-close" href="../images/logo_symbol_gold.png" x="617" y="44" width="46" height="96" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="tagline" data-pptx-bounds="140 156 1000 108">
    <text x="640" y="236" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="72" font-style="italic" fill="#E2CB97">Sanjhi Soch, Sunehra Kal.</text>
  </g>
  <g id="quote" data-pptx-bounds="140 268 1000 92">
    <rect x="610" y="272" width="60" height="2" fill="#C6A65A"/>
    <text x="640" y="316" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="22" fill="#F6F1E5">“Building a credible brand is not just about what reaches the consumer.
      <tspan x="640" dy="30">It is about the people, practices and partnerships behind every grain.”</tspan></text>
  </g>
  <g id="credits" data-pptx-bounds="140 376 1000 108" text-anchor="middle">
    <text x="640" y="402" font-size="18" font-weight="600" fill="#F6F1E5">Ashish Satpathy  |  Janardhan Reddy Bogireddy</text>
    <text x="640" y="432" font-size="14" fill="#C9C3B0">With thanks to the MVS field and programme teams, and to the farmers and community members who gave us their time;
      <tspan x="640" dy="20">and to the DoCC team and SPJIMR for their guidance.</tspan></text>
  </g>
