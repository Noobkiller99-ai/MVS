  <g id="header" data-pptx-bounds="56 36 512 160">
    <text x="56" y="60" font-size="12" font-weight="600" letter-spacing="2" fill="#795C43">ACT IV · DIGITAL STORYTELLING AND QR CONCEPT</text>
    <rect x="56" y="72" width="40" height="2" fill="#C6A65A"/>
    <text x="56" y="122" font-family="'Playfair Display', Georgia, serif" font-size="38" fill="#103F30">A QR story that says only
      <tspan x="56" dy="46" font-style="italic" fill="#795C43">what records support.</tspan></text>
  </g>
  <g id="journey" data-pptx-bounds="56 206 512 196">
    <text x="56" y="222" font-size="12" font-weight="600" letter-spacing="2" fill="#795C43">THE CONSUMER JOURNEY · CONCEPT</text>
    <g id="p16-step-1" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="homePlate" data-pptx-frame="56 236 168 48" fill="#103F30" stroke="none">
