    <text x="840" y="408" font-size="15" fill="#292D2A">Chosen for feasibility: the team had local
      <tspan x="840" dy="21">access and could learn closely. Not a claim</tspan>
      <tspan x="840" dy="21">that these cities hold the largest demand.</tspan></text>
    <text x="840" y="490" font-size="15" fill="#292D2A"><tspan font-weight="600" fill="#103F30">Next:</tspan> Delhi NCR, once quality, repeat
      <tspan x="840" dy="21">purchase and service feasibility are shown.</tspan></text>
