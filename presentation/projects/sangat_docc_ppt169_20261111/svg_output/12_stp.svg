    <text x="80" y="598" font-size="12" font-weight="600" letter-spacing="2" fill="#795C43">PROPOSED POSITIONING · CONDITIONAL ON A WRITTEN SPEC AND COOKING TESTS</text>
    <text x="80" y="626" font-size="15" fill="#292D2A">For households that already buy premium basmati and care how their food is grown, <tspan font-weight="600" fill="#103F30">Sangat</tspan> is the premium basmati from farming
