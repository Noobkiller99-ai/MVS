    <text x="56" y="122" font-family="'Playfair Display', Georgia, serif" font-size="38" fill="#F6F1E5">One identity system:
      <tspan x="56" dy="46" font-style="italic" fill="#E2CB97">forest, ivory and a</tspan>
      <tspan x="56" dy="46" font-style="italic" fill="#E2CB97">golden ear of rice.</tspan></text>
  </g>
  <g id="wordmark-note" data-pptx-bounds="56 250 480 106">
