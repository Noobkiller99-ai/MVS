      <tspan x="56" dy="25">golden rice-ear motif and a sweeping underline,</tspan>
      <tspan x="56" dy="25">in primary, horizontal, stacked, wordmark and</tspan>
      <tspan x="56" dy="25">symbol-only versions.</tspan></text>
  </g>
  <g id="values" data-pptx-bounds="56 376 360 290">
