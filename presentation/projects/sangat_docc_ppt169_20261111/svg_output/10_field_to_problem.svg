    <text x="480" y="244" font-size="12" font-weight="600" letter-spacing="2" fill="#C6A65A">THE PROBLEM WE WORKED ON</text>
    <text x="480" y="290" font-family="'Playfair Display', Georgia, serif" font-size="22" fill="#F6F1E5">How can MVS translate its
