      <tspan x="480" dy="31">sourcing story, operating</tspan>
      <tspan x="480" dy="31">model and proposition aligned?</tspan></text>
    <text x="480" y="530" font-size="12" fill="#C9C3B0">Problem statement, MVS project report §1.2</text>
