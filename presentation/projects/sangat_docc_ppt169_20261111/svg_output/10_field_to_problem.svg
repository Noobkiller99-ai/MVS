    <line x1="56" y1="588" x2="1224" y2="588" stroke="#C6A65A" stroke-width="1.5"/>
    <text x="56" y="630" font-family="'Playfair Display', Georgia, serif" font-size="22" font-style="italic" fill="#103F30">A brand can make MVS’s farming work visible — but only if product, evidence and operations align.</text>
