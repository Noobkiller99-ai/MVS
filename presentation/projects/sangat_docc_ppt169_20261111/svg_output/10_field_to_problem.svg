  <g id="requirements" data-pptx-bounds="884 200 340 360">
    <text x="884" y="218" font-size="12" font-weight="600" letter-spacing="2" fill="#795C43">THREE REQUIREMENTS</text>
    <rect x="884" y="232" width="340" height="100" fill="#EDE5D3"/>
    <rect x="884" y="232" width="4" height="100" fill="#C6A65A"/>
    <text x="904" y="262" font-size="16" font-weight="600" fill="#103F30">Product reliability</text>
    <text x="904" y="286" font-size="14" fill="#292D2A">Can the same quality be supplied
      <tspan x="904" dy="20">across batches?</tspan></text>
    <rect x="884" y="344" width="340" height="100" fill="#EDE5D3"/>
    <rect x="884" y="344" width="4" height="100" fill="#C6A65A"/>
    <text x="904" y="374" font-size="16" font-weight="600" fill="#103F30">Evidence and communication</text>
    <text x="904" y="398" font-size="14" fill="#292D2A">Can the cultivation story be backed by
      <tspan x="904" dy="20">farm, season and sourcing records?</tspan></text>
    <rect x="884" y="456" width="340" height="100" fill="#EDE5D3"/>
    <rect x="884" y="456" width="4" height="100" fill="#C6A65A"/>
    <text x="904" y="486" font-size="16" font-weight="600" fill="#103F30">Operating viability</text>
    <text x="904" y="510" font-size="14" fill="#292D2A">Can supply, processing, packing and
      <tspan x="904" dy="20">selling costs support the price?</tspan></text>
  </g>
